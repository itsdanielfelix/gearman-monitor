name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - runs-on: macos-latest
            target: bun-darwin-arm64
            artifact: gearman-monitor-macos-arm64
          - runs-on: macos-latest
            target: bun-darwin-x64
            artifact: gearman-monitor-macos-x64
          - runs-on: ubuntu-latest
            target: bun-linux-x64
            artifact: gearman-monitor-linux-x64
          - runs-on: ubuntu-latest
            target: bun-linux-arm64
            artifact: gearman-monitor-linux-arm64

    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build
        run: bun build --compile --target=${{ matrix.target }} src/index.tsx --outfile ${{ matrix.artifact }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gearman-monitor-*
          merge-multiple: false
      - name: Display structure
        run: ls -laR artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/gearman-monitor-macos-arm64
            artifacts/gearman-monitor-macos-x64
            artifacts/gearman-monitor-linux-x64
            artifacts/gearman-monitor-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
